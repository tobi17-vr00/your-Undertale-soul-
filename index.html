<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Your Undertale Soul</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0a0d;
    --panel:#000000;
    --ink:#ffffff;
    --dim:#8a8a94;
    --det:#ff0033;
    --bra:#ff9a1f;
    --jus:#ffe600;
    --kin:#25e07a;
    --int:#2f8cff;
    --per:#b23bff;
    --pat:#28e0ff;
    --accent: var(--det);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    background:
      radial-gradient(circle at 50% 0%, #16141c 0%, var(--bg) 55%),
      var(--bg);
    color:var(--ink);
    font-family:'Tajawal', sans-serif;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
    overflow-x:hidden;
  }
  .stage{ width:100%; max-width:560px; }
  .kicker{
    font-family:'Press Start 2P', monospace;
    font-size:10px; letter-spacing:2px; color:var(--dim);
    text-align:center; margin-bottom:14px;
    animation: flicker 3.4s infinite;
  }
  @keyframes flicker{ 0%,92%,100%{opacity:.8;} 94%{opacity:.3;} 96%{opacity:.9;} }

  .box{
    background:var(--panel);
    border:4px solid var(--ink);
    box-shadow: 0 0 0 2px #000, 8px 8px 0 rgba(255,255,255,0.05);
    border-radius:2px;
    padding:28px 24px;
    position:relative;
    min-height:280px;
    display:flex;
    flex-direction:column;
  }
  .box::before{
    content:"";
    position:absolute; inset:8px;
    border:1px solid rgba(255,255,255,0.15);
    pointer-events:none;
  }

  .screen{ display:none; flex-direction:column; flex:1; gap:18px; animation: fadeIn .35s ease; }
  .screen.active{ display:flex; }
  @keyframes fadeIn{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);} }

  #screen-start{ align-items:center; justify-content:center; text-align:center; gap:22px; }
  .title{
    font-family:'Press Start 2P', monospace;
    font-size:22px; line-height:1.7; color:var(--ink);
    text-shadow: 0 0 12px rgba(255,0,51,0.5);
  }
  .subtitle{ color:var(--dim); font-size:15px; line-height:1.9; max-width:400px; }
  .soul-row{ display:flex; gap:8px; flex-wrap:wrap; justify-content:center; margin:6px 0; }
  .mini-heart{ width:14px; height:14px; transform:rotate(45deg); border-radius:2px; opacity:.9; }

  .lang-switch{ display:flex; gap:8px; justify-content:center; }
  .lang-btn{
    font-family:'Press Start 2P', monospace;
    font-size:10px; color:var(--dim);
    background:transparent; border:2px solid #2a2a32;
    padding:6px 10px; cursor:pointer;
    transition: color .15s, border-color .15s;
  }
  .lang-btn.active{ color:var(--ink); border-color:var(--ink); }
  .lang-btn:hover{ color:var(--ink); }

  .btn{
    font-family:'Tajawal', sans-serif;
    font-weight:700; font-size:15px; color:var(--ink);
    background:transparent; border:3px solid var(--ink);
    padding:13px 16px; text-align:right; cursor:pointer;
    display:flex; align-items:center; gap:12px;
    transition: background .12s, color .12s, border-color .12s;
  }
  .btn:hover, .btn:focus-visible{ background:var(--ink); color:#000; outline:none; }
  .btn .pointer{
    width:12px; height:12px; background:var(--det);
    transform:rotate(45deg); flex-shrink:0; opacity:0;
    transition:opacity .12s;
  }
  .btn:hover .pointer, .btn:focus-visible .pointer{ opacity:1; }

  .btn-start{
    font-family:'Press Start 2P', monospace;
    font-size:13px; justify-content:center; padding:18px;
  }

  html[dir="ltr"] .btn{ text-align:left; }

  .social-dock{
    position:fixed; bottom:16px; left:16px;
    display:none;
    flex-direction:column; gap:8px;
    z-index:50;
  }
  .social-dock.visible{ display:flex; }
  .social-btn{
    width:34px; height:34px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    background:#000; text-decoration:none;
    box-shadow:0 0 8px rgba(0,0,0,0.6);
    transition: transform .15s;
  }
  .social-btn:hover{ transform:scale(1.12); }
  .social-btn svg{ width:16px; height:16px; }
  .social-fb{ border:2px solid #1877F2; color:#1877F2; }
  .social-ig{ border:2px solid #ff3b3b; color:#ff3b3b; }
  .social-x{ border:2px solid #ffffff; color:#ffffff; }
  .social-itch{ border:2px solid #FF7A00; color:#FF7A00; }

  .visitor-dock{
    position:fixed; bottom:16px; right:16px;
    display:none;
    z-index:50;
    opacity:.85;
  }
  .visitor-dock.visible{ display:block; }
  .visitor-dock img{ height:20px; display:block; border-radius:3px; }

  .progress-row{ display:flex; align-items:center; justify-content:space-between; gap:12px; }
  .progress-label{ font-size:11px; color:var(--dim); font-family:'Press Start 2P', monospace; }
  .progress-track{ flex:1; height:8px; background:#1c1c22; position:relative; overflow:hidden; }
  .progress-fill{ height:100%; background:var(--det); width:0%; transition:width .3s ease; box-shadow:0 0 8px var(--det); }
  .question-text{ font-size:18px; line-height:1.85; font-weight:700; min-height:70px; }
  .options{ display:flex; flex-direction:column; gap:10px; margin-top:auto; }

  #screen-result{ align-items:center; text-align:center; gap:14px; }
  .result-eyebrow{ font-family:'Press Start 2P', monospace; font-size:10px; color:var(--dim); letter-spacing:2px; }

  .result-name{ display:flex; flex-direction:column; align-items:center; gap:4px; }
  .you-are-label{
    font-family:'Press Start 2P', monospace;
    font-size:11px; color:var(--dim); letter-spacing:1px;
  }
  .soul-name-ar{
    font-family:'Press Start 2P', monospace;
    font-size:22px; line-height:1.5;
  }
  .soul-name-en{
    font-family:'Press Start 2P', monospace;
    font-size:14px; line-height:1.5; opacity:.9;
  }

  .portrait-wrap{ display:flex; align-items:flex-end; justify-content:center; gap:26px; margin:6px auto; }
  .portrait-frame{
    width:220px; height:275px;
    border:3px solid var(--ink);
    background:#050505;
    display:flex; align-items:center; justify-content:center;
    overflow:hidden;
    box-shadow: 0 0 24px var(--accent);
  }
  .portrait-frame img{ width:100%; height:100%; object-fit:cover; display:block; }

  .result-intro{ font-size:15.5px; line-height:1.9; color:var(--ink); max-width:420px; min-height:1.4em; }
  .result-intro .cursor{
    display:inline-block; width:2px; height:1em; background:var(--ink);
    margin-right:2px; vertical-align:middle;
    animation: blink 0.85s steps(1) infinite;
  }
  .result-quote{
    font-size:15.5px; line-height:1.95; color:#f0f0f0;
    max-width:420px; font-style:italic;
    border-right:3px solid var(--accent);
    padding-right:12px; text-align:right;
    min-height:1.2em;
  }
  html[dir="ltr"] .result-quote{
    border-right:none; border-left:3px solid var(--accent);
    padding-right:0; padding-left:12px; text-align:left;
  }
  .result-quote .cursor{
    display:inline-block; width:2px; height:1em; background:var(--accent);
    margin-right:2px; vertical-align:middle;
    animation: blink 0.85s steps(1) infinite;
  }
  @keyframes blink{ 50%{ opacity:0; } }
  .skip-hint{ font-size:11px; color:var(--dim); cursor:pointer; }

  .result-actions{ display:flex; gap:10px; flex-wrap:wrap; justify-content:center; margin-top:4px; }
  .retry, .stats-btn{
    font-family:'Press Start 2P', monospace;
    font-size:11px; color:var(--dim);
    background:transparent; border:2px solid var(--dim);
    padding:10px 16px; cursor:pointer; transition: all .15s;
  }
  .retry:hover, .stats-btn:hover{ color:var(--ink); border-color:var(--ink); }

  .stats-overlay{
    position:absolute; inset:0;
    background:
      radial-gradient(circle at 50% 0%, #17151d 0%, #050506 60%),
      rgba(0,0,0,0.97);
    display:none;
    flex-direction:column; gap:16px;
    padding:28px 22px;
    overflow-y:auto;
    z-index:10;
  }
  .stats-overlay.open{ display:flex; animation: fadeIn .25s ease; }
  .stats-title{
    font-family:'Press Start 2P', monospace;
    font-size:14px; text-align:center; color:var(--ink);
    letter-spacing:1px;
  }
  .stats-total{
    text-align:center; color:var(--dim); font-size:12px;
    border:1px solid #232329; padding:10px 14px;
    background:rgba(255,255,255,0.02);
  }
  .stats-total b{
    display:block; color:var(--ink); font-size:22px;
    font-family:'Press Start 2P', monospace; margin-top:4px;
  }
  .stats-list{ display:flex; flex-direction:column; gap:14px; margin-top:2px; }
  .stats-card{
    border:1px solid #232329;
    background:rgba(255,255,255,0.015);
    padding:10px 12px;
    transition: border-color .3s, background .3s;
  }
  .stats-card.top{
    border-color: var(--card-color, var(--ink));
    background: rgba(255,255,255,0.04);
  }
  .stats-row-label{ display:flex; justify-content:space-between; align-items:center; font-size:13px; margin-bottom:8px; }
  .stats-soul-name{ display:flex; align-items:center; gap:8px; font-weight:700; }
  .stats-dot{ width:9px; height:9px; border-radius:50%; flex-shrink:0; }
  .stats-pct{ font-family:'Press Start 2P', monospace; font-size:12px; }
  .stats-count{ color:var(--dim); font-size:11px; }
  .stats-bar-track{ height:12px; background:#131317; overflow:hidden; border-radius:2px; }
  .stats-bar-fill{
    height:100%; width:0%;
    transition:width 1s cubic-bezier(.2,.8,.2,1), box-shadow .6s ease;
    border-radius:2px;
  }
  .stats-msg{ text-align:center; color:var(--dim); font-size:13px; }
  .stats-crown{ font-size:12px; }
  .stats-close{
    align-self:center; margin-top:auto;
    font-family:'Press Start 2P', monospace;
    font-size:11px; color:var(--dim);
    background:transparent; border:2px solid var(--dim);
    padding:10px 16px; cursor:pointer;
  }
  .stats-close:hover{ color:var(--ink); border-color:var(--ink); }

  @media (max-width:480px){
    .title{ font-size:17px; }
    .box{ padding:20px 16px; }
    .question-text{ font-size:16.5px; }
  }
  @media (prefers-reduced-motion: reduce){ *{ animation:none !important; transition:none !important; } }
</style>
</head>
<body>

<div class="stage">
  <div class="kicker" id="kicker-text">* بقي روح واحدة صامدة في هذا الطريق</div>

  <div class="box">

    <!-- ============ Start screen ============ -->
    <div class="screen active" id="screen-start">
      <div class="soul-row" id="soul-preview"></div>
      <div class="kicker" style="margin-bottom:0;">Your Undertale Soul</div>
      <div class="title" id="title-text">أي روح تحملها؟</div>
      <p class="subtitle" id="subtitle-text">عشرون سؤالًا تكشف إلى أي الأرواح السبعة تنتمي. أجب بصدق، فكل اختيار يترك أثرًا.</p>
      <div class="lang-switch" id="lang-switch">
        <button class="lang-btn active" data-lang="ar">AR</button>
        <button class="lang-btn" data-lang="en">EN</button>
        <button class="lang-btn" data-lang="es">ES</button>
      </div>
      <button class="btn btn-start" id="btn-begin"><span id="begin-text">ابدأ الرحلة ▶</span></button>
    </div>

    <!-- ============ Quiz screen ============ -->
    <div class="screen" id="screen-quiz">
      <div class="progress-row">
        <span class="progress-label" id="progress-label">1 / 20</span>
        <div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div>
      </div>
      <p class="question-text" id="question-text"></p>
      <div class="options" id="options-container"></div>
    </div>

    <!-- ============ Result screen ============ -->
    <div class="screen" id="screen-result">
      <div class="result-eyebrow" id="eyebrow-text">* روحك الحقيقية هي</div>
      <p class="result-intro" id="result-intro"><span id="intro-text"></span><span class="cursor" id="intro-cursor"></span></p>
      <div class="result-name" id="result-name" style="display:none;">
        <div class="you-are-label" id="youare-text">روحك هي</div>
        <div class="soul-name-ar" id="soul-name-ar"></div>
        <div class="soul-name-en" id="soul-name-en"></div>
      </div>
      <div class="portrait-wrap" id="portrait-wrap" style="display:none;">
        <div class="portrait-frame" id="portrait-frame"></div>
      </div>
      <p class="result-quote" id="result-quote" style="display:none;"><span id="quote-text"></span><span class="cursor" id="quote-cursor"></span></p>
      <span class="skip-hint" id="skip-hint">(اضغط هنا لإظهار النص كاملًا)</span>
      <div class="result-actions" id="result-actions" style="display:none;">
        <button class="retry" id="btn-retry"><span id="retry-text">أعد المحاولة من جديد</span></button>
        <button class="stats-btn" id="btn-stats"><span id="stats-btn-text">📊 الإحصائيات</span></button>
      </div>
    </div>

    <div class="stats-overlay" id="stats-overlay">
      <div class="stats-title" id="stats-title">إحصائيات الأرواح</div>
      <div class="stats-total" id="stats-total"></div>
      <div class="stats-list" id="stats-list"></div>
      <button class="stats-close" id="btn-stats-close"><span id="stats-close-text">إغلاق</span></button>
    </div>

  </div>
</div>

<script>
// ---------------- Visual data (language-independent) ----------------
const SOULS = {
  kindness:      { color:"#25e07a", gif:"images/1000330788.webp", portrait:"images/1000330763.jpg" },
  integrity:     { color:"#2f8cff", gif:"images/1000330785.webp", portrait:"images/1000330760.jpg" },
  patience:      { color:"#28e0ff", gif:"images/1000330790.webp", portrait:"images/1000330762.jpg" },
  justice:       { color:"#ffe600", gif:"images/1000330789.webp", portrait:"images/1000330759.jpg" },
  bravery:       { color:"#ff9a1f", gif:"images/1000330787.webp", portrait:"images/1000330764.jpg" },
  perseverance:  { color:"#b23bff", gif:"images/1000330786.webp", portrait:"images/1000330765.png" },
  determination: { color:"#ff0033", gif:"images/1000330791.webp", portrait:"images/1000330761.jpg" },
};

// ---------------- Soul names / intro / quote per language ----------------
const SOUL_I18N = {
  ar: {
    kindness:      { name:"اللطف", en:"Kindness",
      intro:"روحك مليئة بالرحمة والدفء.\nقلبك اختار أن يفهم الآخرين قبل أن يحكم عليهم.",
      quote:"اللطف ليس ضعفًا، بل قوة لا يملكها إلا من يستطيع أن يختار الرحمة عندما يكون قادرًا على القسوة. في عالم مليء بالألم، أنت الشخص الذي يحاول أن يترك أثرًا أفضل." },
    integrity:     { name:"النزاهة", en:"Integrity",
      intro:"روحك تحمل الحقيقة والمبادئ فوق كل شيء.\nأنت لا تبحث عن الطريق الأسهل، بل عن الطريق الصحيح.",
      quote:"قد يكون الصدق مؤلمًا، وقد تكون الحقيقة ثقيلة، لكنك تؤمن أن فقدان نفسك أسوأ من خسارة أي شيء آخر. مبادئك هي الشيء الذي لا يمكن لأحد أخذه منك." },
    patience:      { name:"الصبر", en:"Patience",
      intro:"روحك تعرف أن لكل شيء وقته المناسب.\nأنت لا تندفع خلف اللحظة، بل تراقب، تفهم، وتنتظر الفرصة الصحيحة.",
      quote:"في عالم يطالب الجميع بالسرعة، اخترت أن تمنح الأشياء وقتها. الصبر ليس الوقوف بلا حركة، بل امتلاك القوة للانتظار دون أن تفقد إيمانك. فبعض أعظم الانتصارات لا تأتي لمن يركض أسرع، بل لمن يبقى ثابتًا حتى النهاية." },
    justice:       { name:"العدالة", en:"Justice",
      intro:"روحك تحمل ميزان الحق ولا تقبل تجاهل الخطأ.\nأنت لا تبحث عن الانتقام، بل عن محاسبة من يستحق.",
      quote:"العالم لا يصبح أفضل بالصمت أمام الظلم. الرحمة مهمة، لكن بدون حدود تصبح الفوضى. أنت الشخص الذي يقف عندما يختار الآخرون النظر بعيدًا." },
    bravery:       { name:"الشجاعة", en:"Bravery",
      intro:"روحك لا تعرف معنى الاستسلام للخوف.\nأنت تمشي إلى الأمام حتى عندما ترتجف خطواتك.",
      quote:"الشجاعة ليست غياب الخوف، بل القرار بأن هناك أشياء أهم من خوفك. أحيانًا لا يحتاج العالم إلى شخص لا يخاف، بل إلى شخص يواجه خوفه." },
    perseverance:  { name:"المثابرة", en:"Perseverance",
      intro:"روحك تحمل آثار كل معركة خضتها، لكنها لم تستطع كسر إرادتك.\nكل سقوط جعلك أقوى، وكل ألم أصبح خطوة أخرى نحو هدفك.",
      quote:"المثابرة ليست أن لا تتألم، بل أن تستمر رغم الألم. هي أن تحمل جراحك وتنهض مرة أخرى، ليس لأن الطريق سهل، بل لأن الاستسلام ليس خيارًا. قد تتغير، وقد تتعب، وقد تخسر الكثير... لكنك تستمر في التقدم." },

    subtitle:"عشرون سؤالًا تكشف إلى أي الأرواح السبعة تنتمي. أجب بصدق، فكل اختيار يترك أثرًا.",
    begin:"ابدأ الرحلة ▶", youAre:"روحك هي", eyebrow:"* روحك الحقيقية هي",

    statsBtn:"📊 الإحصائيات", statsTitle:"إحصائيات الأرواح", totalUsers:"إجمالي المشاركين",
    statsLoading:"جاري التحميل...", statsError:"تعذر تحميل الإحصائيات", statsClose:"إغلاق" },
  en: { kicker:"* One soul remains standing on this path", title:"Which soul do you carry?",
    subtitle:"Twenty questions reveal which of the seven souls you belong to. Answer honestly — every choice leaves a mark.",
    begin:"Begin the Journey ▶", youAre:"You are filled with", eyebrow:"* Your true soul is",
    skip:"(tap here to reveal the full text)", retry:"Try Again",
    statsBtn:"📊 Stats", statsTitle:"Soul Statistics", totalUsers:"Total participants",
    statsLoading:"Loading...", statsError:"Couldn't load statistics", statsClose:"Close" },
  es: { kicker:"* Un alma permanece de pie en este camino", title:"¿Qué alma llevas?",
    subtitle:"Veinte preguntas revelan a cuál de las siete almas perteneces. Responde con sinceridad: cada elección deja huella.",

    skip:"(toca aquí para mostrar el texto completo)", retry:"Intentar de nuevo",
    statsBtn:"📊 Estadísticas", statsTitle:"Estadísticas de almas", totalUsers:"Participantes totales",
    statsLoading:"Cargando...", statsError:"No se pudieron cargar las estadísticas", statsClose:"Cerrar" },
};

// ---------------- Visitor stats backend (free, no signup) ----------------
const STATS_BASE = 'https://countapi.mileshilliard.com/api/v1';
const STATS_PREFIX = 'undertale-soul-quiz-tobi17vr00';
function statHit(key){
  fetch(`${STATS_BASE}/hit/${STATS_PREFIX}_${key}`).catch(()=>{});
}
function statGet(key){
  return fetch(`${STATS_BASE}/get/${STATS_PREFIX}_${key}`)
    .then(r => r.ok ? r.json() : {value:0})
    .then(d => parseInt(d.value) || 0)
    .catch(() => 0);
}

// ---------------- Game state ----------------
let LANG = 'ar';
let currentIndex = 0;
let scores = {};
let typeTimer = null;

function resetScores(){
  scores = {};
  Object.keys(SOULS).forEach(k => scores[k] = 0);
}

// ---------------- DOM references ----------------
const screenStart = document.getElementById('screen-start');
const screenQuiz = document.getElementById('screen-quiz');
const screenResult = document.getElementById('screen-result');
const btnBegin = document.getElementById('btn-begin');
const btnRetry = document.getElementById('btn-retry');
const questionText = document.getElementById('question-text');
const optionsContainer = document.getElementById('options-container');
const progressLabel = document.getElementById('progress-label');
const progressFill = document.getElementById('progress-fill');
const soulPreview = document.getElementById('soul-preview');
const resultName = document.getElementById('result-name');
const soulNameAr = document.getElementById('soul-name-ar');
const soulNameEn = document.getElementById('soul-name-en');
const introText = document.getElementById('intro-text');
const introCursor = document.getElementById('intro-cursor');
const quoteText = document.getElementById('quote-text');
const quoteCursor = document.getElementById('quote-cursor');
const resultQuote = document.getElementById('result-quote');
const skipHint = document.getElementById('skip-hint');
const portraitWrap = document.getElementById('portrait-wrap');
const portraitFrame = document.getElementById('portrait-frame');
const kickerText = document.getElementById('kicker-text');
const titleText = document.getElementById('title-text');
const subtitleText = document.getElementById('subtitle-text');
const beginText = document.getElementById('begin-text');
const eyebrowText = document.getElementById('eyebrow-text');
const youareText = document.getElementById('youare-text');
const skipText = document.getElementById('skip-hint');
const retryText = document.getElementById('retry-text');
const langButtons = document.querySelectorAll('.lang-btn');
const resultActions = document.getElementById('result-actions');
const btnStats = document.getElementById('btn-stats');
const statsBtnText = document.getElementById('stats-btn-text');
const statsOverlay = document.getElementById('stats-overlay');
const statsTitleEl = document.getElementById('stats-title');
const statsTotalEl = document.getElementById('stats-total');
const statsListEl = document.getElementById('stats-list');
const btnStatsClose = document.getElementById('btn-stats-close');
const statsCloseText = document.getElementById('stats-close-text');

Object.values(SOULS).forEach(s => {
  const dot = document.createElement('div');
  dot.className = 'mini-heart';
  dot.style.background = s.color;
  dot.style.boxShadow = `0 0 8px ${s.color}`;
  soulPreview.appendChild(dot);
});

function applyUIText(){
  const t = UI[LANG];
  kickerText.textContent = t.kicker;
  titleText.textContent = t.title;
  subtitleText.textContent = t.subtitle;
  beginText.textContent = t.begin;
  eyebrowText.textContent = t.eyebrow;
  youareText.textContent = t.youAre;
  retryText.textContent = t.retry;
  skipHint.textContent = t.skip;
  statsBtnText.textContent = t.statsBtn;
  statsTitleEl.textContent = t.statsTitle;
  statsCloseText.textContent = t.statsClose;
}

function setLang(lang){
  LANG = lang;
  document.documentElement.lang = lang;
  document.documentElement.dir = (lang === 'ar') ? 'rtl' : 'ltr';
  langButtons.forEach(b => b.classList.toggle('active', b.dataset.lang === lang));
  applyUIText();
  if(screenQuiz.classList.contains('active')){ renderQuestion(); }
}

langButtons.forEach(btn => {
  btn.addEventListener('click', () => setLang(btn.dataset.lang));
});

function showScreen(el){
  [screenStart, screenQuiz, screenResult].forEach(s => s.classList.remove('active'));
  el.classList.add('active');
  const dock = document.getElementById('social-dock');
  const vdock = document.getElementById('visitor-dock');
  if(dock){
    if(el === screenStart){ dock.classList.add('visible'); }
    else{ dock.classList.remove('visible'); }
  }
  if(vdock){
    if(el === screenStart){ vdock.classList.add('visible'); }
    else{ vdock.classList.remove('visible'); }
  }
}

function startQuiz(){
  resetScores();
  currentIndex = 0;
  showScreen(screenQuiz);
  renderQuestion();
}

function renderQuestion(){
  const meta = QUESTIONS[currentIndex];
  const text = QUESTIONS_I18N[LANG][currentIndex];
  questionText.textContent = text.q;
  progressLabel.textContent = `${currentIndex + 1} / ${QUESTIONS.length}`;
  progressFill.style.width = `${(currentIndex / QUESTIONS.length) * 100}%`;

  optionsContainer.innerHTML = '';
  meta.o.forEach((opt, idx) => {
    const btn = document.createElement('button');
    btn.className = 'btn';
    btn.innerHTML = `<span class="pointer"></span><span>${text.o[idx]}</span>`;
    btn.addEventListener('click', () => selectOption(opt.s));
    optionsContainer.appendChild(btn);
  });
}

function selectOption(soulPoints){
  Object.keys(soulPoints).forEach(key => {
    scores[key] = (scores[key] || 0) + soulPoints[key];
  });
  currentIndex++;
  if(currentIndex < QUESTIONS.length){
    renderQuestion();
  } else {
    progressFill.style.width = '100%';
    setTimeout(showResult, 250);
  }
}

// ---------------- Typewriter effect ----------------
function typeText(el, text, speed, onDone){
  clearInterval(typeTimer);
  el.textContent = '';
  let i = 0;
  typeTimer = setInterval(() => {
    el.textContent += text[i];
    i++;
    if(i >= text.length){
      clearInterval(typeTimer);
      if(onDone) onDone();
    }
  }, speed);
}

let currentSoul = null;
let revealStage = 0; // 0 = typing intro, 1 = typing quote, 2 = done

function showResult(){
  let winner = Object.keys(scores)[0];
  Object.keys(scores).forEach(k => {
    if(scores[k] > scores[winner]) winner = k;
  });
  const visual = SOULS[winner];
  const soul = Object.assign({ key: winner }, visual, SOUL_I18N[LANG][winner]);
  currentSoul = soul;

  document.documentElement.style.setProperty('--accent', soul.color);

  resultName.style.display = 'none';
  portraitWrap.style.display = 'none';
  resultQuote.style.display = 'none';
  resultActions.style.display = 'none';
  statHit(winner);
  statHit('total');
  soulNameAr.textContent = `${soul.name}`;
  soulNameAr.style.color = soul.color;
  if(LANG === 'ar'){
    soulNameEn.textContent = `(${soul.en})`;
    soulNameEn.style.color = soul.color;
    soulNameEn.style.display = 'block';
  } else {
    soulNameEn.style.display = 'none';
  }
  introCursor.style.display = 'inline-block';
  quoteCursor.style.display = 'inline-block';

  showScreen(screenResult);

  revealStage = 0;
  typeText(introText, soul.intro, 55, () => {
    introCursor.style.display = 'none';
    revealStage = 1;
    revealNameAndImages(soul);
  });
}

function revealNameAndImages(soul){
  resultName.style.display = 'block';
  portraitWrap.style.display = 'inline-block';

  portraitFrame.innerHTML = '';
  const portrait = new Image();
  portrait.alt = soul.name;
  portrait.onerror = () => { portraitFrame.innerHTML = `<span class="gif-fallback">${soul.portrait}</span>`; };
  portrait.src = soul.portrait;
  portraitFrame.appendChild(portrait);

  resultQuote.style.display = 'block';
  typeText(quoteText, soul.quote, 55, () => {
    quoteCursor.style.display = 'none';
    revealStage = 2;
    resultActions.style.display = 'flex';
  });
}

skipHint.addEventListener('click', () => {
  if(!currentSoul) return;
  clearInterval(typeTimer);
  introText.textContent = currentSoul.intro;
  introCursor.style.display = 'none';
  quoteText.textContent = currentSoul.quote;
  quoteCursor.style.display = 'none';
  if(portraitWrap.style.display === 'none'){
    resultName.style.display = 'block';
    portraitWrap.style.display = 'inline-block';
    portraitFrame.innerHTML = '';
    const portrait = new Image();
    portrait.onerror = () => { portraitFrame.innerHTML = `<span class="gif-fallback">${currentSoul.portrait}</span>`; };
    portrait.src = currentSoul.portrait;
    portraitFrame.appendChild(portrait);
  }
  resultQuote.style.display = 'block';
  revealStage = 2;
  resultActions.style.display = 'flex';
});

btnBegin.addEventListener('click', startQuiz);
btnRetry.addEventListener('click', () => { clearInterval(typeTimer); showScreen(screenStart); });

const SOUL_KEYS = Object.keys(SOULS);

btnStats.addEventListener('click', () => {
  statsOverlay.classList.add('open');
  const t = UI[LANG];
  statsTotalEl.textContent = t.statsLoading;
  statsListEl.innerHTML = '';

  const gets = SOUL_KEYS.map(k => statGet(k));
  gets.push(statGet('total'));

  Promise.all(gets).then(results => {
    const totalFromKey = results.pop();
    const perSoul = {};
    SOUL_KEYS.forEach((k, i) => { perSoul[k] = results[i]; });
    const sumOfSouls = SOUL_KEYS.reduce((a, k) => a + perSoul[k], 0);
    const total = Math.max(totalFromKey, sumOfSouls, 1);

    statsTotalEl.innerHTML = `${t.totalUsers}<b>${totalFromKey}</b>`;
    statsListEl.innerHTML = '';

    const sorted = [...SOUL_KEYS].sort((a, b) => perSoul[b] - perSoul[a]);
    const highestCount = Math.max(...SOUL_KEYS.map(k => perSoul[k]));

    sorted.forEach((k, index) => {
      const count = perSoul[k];
      const pct = Math.round((count / total) * 100);
      const name = SOUL_I18N[LANG][k].name;
      const color = SOULS[k].color;
      const isTop = count === highestCount && count > 0;
      const glow = 4 + (pct / 100) * 14;

      const card = document.createElement('div');
      card.className = 'stats-card' + (isTop ? ' top' : '');
      card.style.setProperty('--card-color', color);
      card.innerHTML = `
        <div class="stats-row-label">
          <span class="stats-soul-name"><span class="stats-dot" style="background:${color};"></span>${isTop ? '<span class="stats-crown">👑</span> ' : ''}${name}</span>
          <span><span class="stats-pct" style="color:${color};">${pct}%</span> <span class="stats-count">(${count})</span></span>
        </div>
        <div class="stats-bar-track"><div class="stats-bar-fill" style="width:${pct}%; background:${color}; box-shadow:0 0 ${glow}px ${color};"></div></div>
      `;
      statsListEl.appendChild(card);
    });
  }).catch(() => {
    statsTotalEl.textContent = t.statsError;
  });
});

btnStatsClose.addEventListener('click', () => {
  statsOverlay.classList.remove('open');
});

applyUIText();
</script>
