<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Your Undertale Soul</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0a0d;
    --panel:#000000;
    --ink:#ffffff;
    --dim:#8a8a94;
    --det:#ff0033;
    --bra:#ff9a1f;
    --jus:#ffe600;
    --kin:#25e07a;
    --int:#2f8cff;
    --per:#b23bff;
    --pat:#28e0ff;
    --accent: var(--det);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    background:
      radial-gradient(circle at 50% 0%, #16141c 0%, var(--bg) 55%),
      var(--bg);
    color:var(--ink);
    font-family:'Tajawal', sans-serif;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
    overflow-x:hidden;
  }
  .stage{ width:100%; max-width:560px; }
  .kicker{
    font-family:'Press Start 2P', monospace;
    font-size:10px; letter-spacing:2px; color:var(--dim);
    text-align:center; margin-bottom:14px;
    animation: flicker 3.4s infinite;
  }
  @keyframes flicker{ 0%,92%,100%{opacity:.8;} 94%{opacity:.3;} 96%{opacity:.9;} }

  .box{
    background:var(--panel);
    border:4px solid var(--ink);
    box-shadow: 0 0 0 2px #000, 8px 8px 0 rgba(255,255,255,0.05);
    border-radius:2px;
    padding:28px 24px;
    position:relative;
    min-height:280px;
    display:flex;
    flex-direction:column;
  }
  .box::before{
    content:"";
    position:absolute; inset:8px;
    border:1px solid rgba(255,255,255,0.15);
    pointer-events:none;
  }

  .screen{ display:none; flex-direction:column; flex:1; gap:18px; animation: fadeIn .35s ease; }
  .screen.active{ display:flex; }
  @keyframes fadeIn{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);} }

  #screen-start{ align-items:center; justify-content:center; text-align:center; gap:22px; }
  .title{
    font-family:'Press Start 2P', monospace;
    font-size:22px; line-height:1.7; color:var(--ink);
    text-shadow: 0 0 12px rgba(255,0,51,0.5);
  }
  .subtitle{ color:var(--dim); font-size:15px; line-height:1.9; max-width:400px; }
  .soul-row{ display:flex; gap:8px; flex-wrap:wrap; justify-content:center; margin:6px 0; }
  .mini-heart{ width:14px; height:14px; transform:rotate(45deg); border-radius:2px; opacity:.9; }

  .btn{
    font-family:'Tajawal', sans-serif;
    font-weight:700; font-size:15px; color:var(--ink);
    background:transparent; border:3px solid var(--ink);
    padding:13px 16px; text-align:right; cursor:pointer;
    display:flex; align-items:center; gap:12px;
    transition: background .12s, color .12s, border-color .12s;
  }
  .btn:hover, .btn:focus-visible{ background:var(--ink); color:#000; outline:none; }
  .btn .pointer{
    width:12px; height:12px; background:var(--det);
    transform:rotate(45deg); flex-shrink:0; opacity:0;
    transition:opacity .12s;
  }
  .btn:hover .pointer, .btn:focus-visible .pointer{ opacity:1; }

  .btn-start{
    font-family:'Press Start 2P', monospace;
    font-size:13px; justify-content:center; padding:18px;
  }

  .progress-row{ display:flex; align-items:center; justify-content:space-between; gap:12px; }
  .progress-label{ font-size:11px; color:var(--dim); font-family:'Press Start 2P', monospace; }
  .progress-track{ flex:1; height:8px; background:#1c1c22; position:relative; overflow:hidden; }
  .progress-fill{ height:100%; background:var(--det); width:0%; transition:width .3s ease; box-shadow:0 0 8px var(--det); }
  .question-text{ font-size:18px; line-height:1.85; font-weight:700; min-height:70px; }
  .options{ display:flex; flex-direction:column; gap:10px; margin-top:auto; }

  #screen-result{ align-items:center; text-align:center; gap:14px; }
  .result-eyebrow{ font-family:'Press Start 2P', monospace; font-size:10px; color:var(--dim); letter-spacing:2px; }
  .result-name{ font-family:'Press Start 2P', monospace; font-size:22px; line-height:1.6; }

  .result-name{ display:flex; flex-direction:column; align-items:center; gap:4px; }
  .you-are-label{
    font-family:'Press Start 2P', monospace;
    font-size:11px; color:var(--dim); letter-spacing:1px;
  }
  .soul-name-ar{
    font-family:'Press Start 2P', monospace;
    font-size:22px; line-height:1.5;
  }
  .soul-name-en{
    font-family:'Press Start 2P', monospace;
    font-size:14px; line-height:1.5; opacity:.9;
  }

  .portrait-wrap{ display:flex; align-items:flex-end; justify-content:center; gap:26px; margin:6px auto; }
  .portrait-frame{
    width:160px; height:200px;
    border:3px solid var(--ink);
    background:#050505;
    display:flex; align-items:center; justify-content:center;
    overflow:hidden;
    box-shadow: 0 0 24px var(--accent);
  }
  .portrait-frame img{ width:100%; height:100%; object-fit:cover; display:block; }
  .gif-badge{
    width:50px; height:50px;
    border:3px solid var(--ink);
    background:#050505;
    display:flex; align-items:center; justify-content:center;
    overflow:hidden;
    box-shadow: 0 0 14px var(--accent);
    margin-bottom:6px;
  }
  .gif-badge img{ width:100%; height:100%; object-fit:cover; display:block; }

  .result-intro{ font-size:15.5px; line-height:1.9; color:var(--ink); max-width:420px; min-height:1.4em; }
  .result-intro .cursor{
    display:inline-block; width:2px; height:1em; background:var(--ink);
    margin-right:2px; vertical-align:middle;
    animation: blink 0.85s steps(1) infinite;
  }
  .result-quote{
    font-size:15.5px; line-height:1.95; color:#f0f0f0;
    max-width:420px; font-style:italic;
    border-right:3px solid var(--accent);
    padding-right:12px; text-align:right;
    min-height:1.2em;
  }
  .result-quote .cursor{
    display:inline-block; width:2px; height:1em; background:var(--accent);
    margin-right:2px; vertical-align:middle;
    animation: blink 0.85s steps(1) infinite;
  }
  @keyframes blink{ 50%{ opacity:0; } }
  .skip-hint{ font-size:11px; color:var(--dim); cursor:pointer; }

  .retry{
    margin-top:4px;
    font-family:'Press Start 2P', monospace;
    font-size:11px; color:var(--dim);
    background:transparent; border:2px solid var(--dim);
    padding:10px 16px; cursor:pointer; transition: all .15s;
  }
  .retry:hover{ color:var(--ink); border-color:var(--ink); }

  @media (max-width:480px){
    .title{ font-size:17px; }
    .box{ padding:20px 16px; }
    .question-text{ font-size:16.5px; }
  }
  @media (prefers-reduced-motion: reduce){ *{ animation:none !important; transition:none !important; } }
</style>
</head>
<body>

<div class="stage">
  <div class="kicker">* بقي روح واحدة صامدة في هذا الطريق</div>

  <div class="box">

    <!-- ============ شاشة البداية ============ -->
    <div class="screen active" id="screen-start">
      <div class="soul-row" id="soul-preview"></div>
      <div class="kicker" style="margin-bottom:0;">Your Undertale Soul</div>
      <div class="title">أي روح تحملها؟</div>
      <p class="subtitle">عشرون سؤالًا تكشف إلى أي الأرواح السبعة تنتمي. أجب بصدق، فكل اختيار يترك أثرًا.</p>
      <button class="btn btn-start" id="btn-begin">ابدأ الرحلة ▶</button>
    </div>

    <!-- ============ شاشة الأسئلة ============ -->
    <div class="screen" id="screen-quiz">
      <div class="progress-row">
        <span class="progress-label" id="progress-label">1 / 20</span>
        <div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div>
      </div>
      <p class="question-text" id="question-text"></p>
      <div class="options" id="options-container"></div>
    </div>

    <!-- ============ شاشة النتيجة ============ -->
    <div class="screen" id="screen-result">
      <div class="result-eyebrow">* روحك الحقيقية هي</div>
      <p class="result-intro" id="result-intro"><span id="intro-text"></span><span class="cursor" id="intro-cursor"></span></p>
      <div class="result-name" id="result-name" style="display:none;">
        <div class="you-are-label">روحك هي</div>
        <div class="soul-name-ar" id="soul-name-ar"></div>
        <div class="soul-name-en" id="soul-name-en"></div>
      </div>
      <div class="portrait-wrap" id="portrait-wrap" style="display:none;">
        <div class="portrait-frame" id="portrait-frame"></div>
        <div class="gif-badge" id="gif-badge"></div>
      </div>
      <p class="result-quote" id="result-quote" style="display:none;"><span id="quote-text"></span><span class="cursor" id="quote-cursor"></span></p>
      <span class="skip-hint" id="skip-hint">(اضغط هنا لإظهار النص كاملًا)</span>
      <button class="retry" id="btn-retry" style="display:none;">أعد المحاولة من جديد</button>
    </div>

  </div>
</div>

<script>
// ---------------- بيانات الأرواح السبعة ----------------
const SOULS = {
  kindness: { name:"اللطف", en:"Kindness", color:"#25e07a", gif:"images/1000330788.webp", portrait:"images/1000330763.jpg",
    intro:"روحك مليئة بالرحمة والدفء.\nقلبك اختار أن يفهم الآخرين قبل أن يحكم عليهم.",
    quote:"اللطف ليس ضعفًا، بل قوة لا يملكها إلا من يستطيع أن يختار الرحمة عندما يكون قادرًا على القسوة. في عالم مليء بالألم، أنت الشخص الذي يحاول أن يترك أثرًا أفضل." },
  integrity: { name:"النزاهة", en:"Integrity", color:"#2f8cff", gif:"images/1000330785.webp", portrait:"images/1000330760.jpg",
    intro:"روحك تحمل الحقيقة والمبادئ فوق كل شيء.\nأنت لا تبحث عن الطريق الأسهل، بل عن الطريق الصحيح.",
    quote:"قد يكون الصدق مؤلمًا، وقد تكون الحقيقة ثقيلة، لكنك تؤمن أن فقدان نفسك أسوأ من خسارة أي شيء آخر. مبادئك هي الشيء الذي لا يمكن لأحد أخذه منك." },
  patience: { name:"الصبر", en:"Patience", color:"#28e0ff", gif:"images/1000330790.webp", portrait:"images/1000330762.jpg",
    intro:"روحك تعرف أن لكل شيء وقته المناسب.\nأنت لا تندفع خلف اللحظة، بل تراقب، تفهم، وتنتظر الفرصة الصحيحة.",
    quote:"في عالم يطالب الجميع بالسرعة، اخترت أن تمنح الأشياء وقتها. الصبر ليس الوقوف بلا حركة، بل امتلاك القوة للانتظار دون أن تفقد إيمانك. فبعض أعظم الانتصارات لا تأتي لمن يركض أسرع، بل لمن يبقى ثابتًا حتى النهاية." },
  justice: { name:"العدالة", en:"Justice", color:"#ffe600", gif:"images/1000330789.webp", portrait:"images/1000330759.jpg",

  bravery: { name:"الشجاعة", en:"Bravery", color:"#ff9a1f", gif:"images/1000330787.webp", portrait:"images/1000330764.jpg",

    quote:"الشجاعة ليست غياب الخوف، بل القرار بأن هناك أشياء أهم من خوفك. أحيانًا لا يحتاج العالم إلى شخص لا يخاف، بل إلى شخص يواجه خوفه." },
  perseverance: { name:"المثابرة", en:"Perseverance", color:"#b23bff", gif:"images/1000330786.webp", portrait:"images/1000330765.png",
    intro:"روحك تحمل آثار كل معركة خضتها، لكنها لم تستطع كسر إرادتك.\nكل سقوط جعلك أقوى، وكل ألم أصبح خطوة أخرى نحو هدفك.",
    quote:"المثابرة ليست أن لا تتألم، بل أن تستمر رغم الألم. هي أن تحمل جراحك وتنهض مرة أخرى، ليس لأن الطريق سهل، بل لأن الاستسلام ليس خيارًا. قد تتغير، وقد تتعب، وقد تخسر الكثير... لكنك تستمر في التقدم." },
  determination: { name:"العزيمة", en:"Determination", color:"#ff0033", gif:"images/1000330791.webp", portrait:"images/1000330761.jpg",
    intro:"روحك مليئة بالإرادة والأمل الذي لا ينطفئ.\nحتى عندما يصبح الطريق مستحيلًا، أنت تختار الاستمرار.",
    quote:"العزيمة ليست مجرد الرغبة في الفوز، بل القدرة على الوقوف أمام النهاية وقول: لم أنتهِ بعد. هي الشرارة الصغيرة التي تجعل الإنسان يبدأ من جديد مهما كان الظلام كبيرًا." },
};

// ---------------- بنك الأسئلة الرسمي (20 سؤالًا) ----------------
// s = خريطة النقاط: { مفتاح_الروح: عدد_النقاط, ... } يمكن لخيار واحد أن يمنح أكثر من روح
const QUESTIONS = [
{ q:"ما هو الشعور أو المبدأ الذي يلهمك أكثر؟", o:[
  {t:"رؤية الآخرين سعداء", s:{kindness:3}},

  {t:"إنجاز صعب", s:{perseverance:2}},
  {t:"تحقيق هدف", s:{determination:2}}]},
{ q:"شخص غريب يحتاج مساعدتك، لكن مساعدته ستؤخرك عن هدفك. ماذا تفعل؟", o:[

  {t:"أساعده إذا لم يكن هناك خيار آخر", s:{integrity:2}},
  {t:"أجد طريقة لمساعدته وإكمال طريقي", s:{determination:2, perseverance:1}},

  {t:"أنهي العلاقة مباشرة", s:{justice:1, integrity:1}}]},

{ q:"وجدت الشخص المسؤول عن موت شخص تحبه. لديك فرصة لإنهاء حياته ولن يعرف أحد أنك فعلت ذلك. ماذا تفعل؟", o:[

{ q:"شخص تحبه يحمل سرًا. كشفه سينقذ آلاف الأشخاص، لكنه سيدمر حياته بالكامل. ماذا تفعل؟", o:[

  {t:"أخبره بالحقيقة وأترك القرار له", s:{bravery:2, integrity:1}}]},
{ q:"أي جملة تمثلك أكثر؟", o:[

  {t:"حتى لو بقيت وحدي، سأكمل.", s:{determination:3}}]},
{ q:"هل تريد معرفة حقيقتك حتى لو كانت مؤلمة؟", o:[

{ q:"شخص يشبهك تمامًا لكنه اختار طريقًا مظلمًا. ماذا تفعل؟", o:[

{ q:"بعد سنوات من العمل على نفسك، تصل إلى مكان كنت تحلم به منذ طفولتك. لكن عندما تنظر إلى الماضي، تكتشف أن الطريق الذي سلكته جعلك شخصًا مختلفًا تمامًا. أصبحت أقوى وأكثر نجاحًا، لكنك فقدت هدوءك وعلاقاتك وبعض مبادئك القديمة. أمامك خيار العودة إلى من كنت عليه، أو البقاء كما أنت الآن. ماذا تختار؟", o:[
  {t:"أعود", s:{integrity:3, patience:2, kindness:1}},

// ---------------- حالة اللعبة ----------------
let currentIndex = 0;
let scores = {};
let typeTimer = null;

function resetScores(){
  scores = {};
  Object.keys(SOULS).forEach(k => scores[k] = 0);
}

// ---------------- عناصر DOM ----------------
const screenStart = document.getElementById('screen-start');
const screenQuiz = document.getElementById('screen-quiz');
const screenResult = document.getElementById('screen-result');
const btnBegin = document.getElementById('btn-begin');
const btnRetry = document.getElementById('btn-retry');
const questionText = document.getElementById('question-text');
const optionsContainer = document.getElementById('options-container');
const progressLabel = document.getElementById('progress-label');
const progressFill = document.getElementById('progress-fill');
const soulPreview = document.getElementById('soul-preview');
const resultName = document.getElementById('result-name');
const soulNameAr = document.getElementById('soul-name-ar');
const soulNameEn = document.getElementById('soul-name-en');
const introText = document.getElementById('intro-text');
const introCursor = document.getElementById('intro-cursor');
const quoteText = document.getElementById('quote-text');
const quoteCursor = document.getElementById('quote-cursor');
const resultQuote = document.getElementById('result-quote');
const skipHint = document.getElementById('skip-hint');
const portraitWrap = document.getElementById('portrait-wrap');
const portraitFrame = document.getElementById('portrait-frame');
const gifBadge = document.getElementById('gif-badge');

Object.values(SOULS).forEach(s => {
  const dot = document.createElement('div');
  dot.className = 'mini-heart';
  dot.style.background = s.color;
  dot.style.boxShadow = `0 0 8px ${s.color}`;
  soulPreview.appendChild(dot);
});

function showScreen(el){
  [screenStart, screenQuiz, screenResult].forEach(s => s.classList.remove('active'));
  el.classList.add('active');
}

function startQuiz(){
  resetScores();
  currentIndex = 0;
  showScreen(screenQuiz);
  renderQuestion();
}

function renderQuestion(){
  const item = QUESTIONS[currentIndex];
  questionText.textContent = item.q;
  progressLabel.textContent = `${currentIndex + 1} / ${QUESTIONS.length}`;
  progressFill.style.width = `${(currentIndex / QUESTIONS.length) * 100}%`;

  optionsContainer.innerHTML = '';
  item.o.forEach(opt => {
    const btn = document.createElement('button');
    btn.className = 'btn';
    btn.innerHTML = `<span class="pointer"></span><span>${opt.t}</span>`;
    btn.addEventListener('click', () => selectOption(opt.s));
    optionsContainer.appendChild(btn);
  });
}

function selectOption(soulPoints){
  Object.keys(soulPoints).forEach(key => {
    scores[key] = (scores[key] || 0) + soulPoints[key];
  });
  currentIndex++;
  if(currentIndex < QUESTIONS.length){
    renderQuestion();
  } else {
    progressFill.style.width = '100%';
    setTimeout(showResult, 250);
  }
}

// ---------------- تأثير الكتابة حرف بحرف ----------------
function typeText(el, text, speed, onDone){
  clearInterval(typeTimer);
  el.textContent = '';
  let i = 0;
  typeTimer = setInterval(() => {
    el.textContent += text[i];
    i++;
    if(i >= text.length){
      clearInterval(typeTimer);
      if(onDone) onDone();
    }
  }, speed);
}

let currentSoul = null;
let revealStage = 0; // 0 = typing intro, 1 = typing quote, 2 = done

function showResult(){
  let winner = Object.keys(scores)[0];
  Object.keys(scores).forEach(k => {
    if(scores[k] > scores[winner]) winner = k;
  });
  const soul = SOULS[winner];
  currentSoul = soul;

  document.documentElement.style.setProperty('--accent', soul.color);

  // إعادة ضبط العناصر
  resultName.style.display = 'none';
  portraitWrap.style.display = 'none';
  resultQuote.style.display = 'none';
  btnRetry.style.display = 'none';
  soulNameAr.textContent = `${soul.name}`;
  soulNameAr.style.color = soul.color;
  soulNameEn.textContent = `(${soul.en})`;
  soulNameEn.style.color = soul.color;
  introCursor.style.display = 'inline-block';
  quoteCursor.style.display = 'inline-block';

  showScreen(screenResult);

  revealStage = 0;
  typeText(introText, soul.intro, 55, () => {
    introCursor.style.display = 'none';
    revealStage = 1;
    revealNameAndImages(soul);
  });
}

function revealNameAndImages(soul){
  resultName.style.display = 'block';
  portraitWrap.style.display = 'inline-block';

  // صورة الشخصية الرئيسية
  portraitFrame.innerHTML = '';
  const portrait = new Image();
  portrait.alt = `شخصية تحمل روح ${soul.name}`;
  portrait.onerror = () => { portraitFrame.innerHTML = `<span class="gif-fallback">ضع هنا<br>${soul.portrait}</span>`; };
  portrait.src = soul.portrait;
  portraitFrame.appendChild(portrait);

  // شارة القلب الصغيرة (GIF)
  gifBadge.innerHTML = '';
  const badge = new Image();
  badge.alt = `رمز روح ${soul.name}`;
  badge.onerror = () => { gifBadge.style.background = soul.color; };
  badge.src = soul.gif;
  gifBadge.appendChild(badge);

  resultQuote.style.display = 'block';
  typeText(quoteText, soul.quote, 55, () => {
    quoteCursor.style.display = 'none';
    revealStage = 2;
    btnRetry.style.display = 'inline-block';
  });
}

skipHint.addEventListener('click', () => {
  if(!currentSoul) return;
  clearInterval(typeTimer);
  introText.textContent = currentSoul.intro;
  introCursor.style.display = 'none';
  quoteText.textContent = currentSoul.quote;
  quoteCursor.style.display = 'none';
  if(portraitWrap.style.display === 'none'){
    resultName.style.display = 'block';
    portraitWrap.style.display = 'inline-block';
    portraitFrame.innerHTML = '';
    const portrait = new Image();
    portrait.onerror = () => { portraitFrame.innerHTML = `<span class="gif-fallback">ضع هنا<br>${currentSoul.portrait}</span>`; };
    portrait.src = currentSoul.portrait;
    portraitFrame.appendChild(portrait);
    gifBadge.innerHTML = '';
    const badge = new Image();
    badge.onerror = () => { gifBadge.style.background = currentSoul.color; };
    badge.src = currentSoul.gif;
    gifBadge.appendChild(badge);
  }
  resultQuote.style.display = 'block';
  revealStage = 2;
  btnRetry.style.display = 'inline-block';
});

btnBegin.addEventListener('click', startQuiz);
btnRetry.addEventListener('click', () => { clearInterval(typeTimer); showScreen(screenStart); });
</script>
